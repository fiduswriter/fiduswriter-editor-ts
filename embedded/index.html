<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>@fiduswriter/editor — Embedded Demo</title>

        <!-- Host page styles. The Fidus Writer editor is embedded below with
             its own (scoped) stylesheets and does not affect this page. -->
        <style>
            body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                    sans-serif;
                margin: 0;
                background: #f5f5f5;
                color: #222;
            }
            .host-header {
                background: #2c2c2c;
                color: #fff;
                padding: 12px 24px;
                display: flex;
                gap: 16px;
                align-items: center;
            }
            .host-header a {
                color: #8ab4f8;
                text-decoration: none;
            }
            .host-header a:hover {
                text-decoration: underline;
            }
            .host-main {
                max-width: 1200px;
                margin: 0 auto;
                padding: 16px 24px;
            }
            .host-note {
                background: #fffbe6;
                border: 1px solid #e6c800;
                border-radius: 4px;
                padding: 8px 12px;
                margin-bottom: 12px;
                font-size: 13px;
            }
            #fw-editor-app {
                border: 1px solid #ccc;
                border-radius: 6px;
                background: #fff;
                overflow: hidden;
            }
            #fw-editor {
                height: 80vh;
                min-height: 480px;
            }
            #fw-editor-app .fw-editor header {
                position: sticky;
                top: 0;
            }
        </style>

        <!-- Scoped fwtoolkit stylesheets: only affect #fw-editor-app. -->
        <link rel="stylesheet" href="../css-scoped/reset.css" />
        <link rel="stylesheet" href="../css-scoped/fwtoolkit.css" />
        <!-- Editor stylesheets (container-safe; target .fw-editor). -->
        <link rel="stylesheet" href="../css/prosemirror.css" />
        <link rel="stylesheet" href="../css/cropper.min.css" />
        <link rel="stylesheet" href="../css/colors.css" />
        <link rel="stylesheet" href="../css/editor.css" />
        <link rel="stylesheet" href="../css/document.css" />
        <link rel="stylesheet" href="../css/bibliography.css" />
        <link rel="stylesheet" href="../css/footnotes.css" />
        <link rel="stylesheet" href="../css/tracking.css" />
        <link rel="stylesheet" href="../css/carets.css" />
        <link rel="stylesheet" href="../css/chat.css" />
        <link rel="stylesheet" href="../css/citation_dialog.css" />
        <link rel="stylesheet" href="../css/contributors.css" />
        <link rel="stylesheet" href="../css/access_rights_dialog.css" />
        <link rel="stylesheet" href="../css/dot_menu.css" />
        <link rel="stylesheet" href="../css/e2ee.css" />
        <link rel="stylesheet" href="../css/margin_boxes.css" />
        <link rel="stylesheet" href="../css/merge.css" />
        <link rel="stylesheet" href="../css/review.css" />
        <link rel="stylesheet" href="../css/table.css" />
        <link rel="stylesheet" href="../css/tags.css" />
        <link rel="stylesheet" href="../css/figure.css" />
        <link rel="stylesheet" href="../css/fontawesome/css/all.css" />
        <!-- Inert reset link: satisfies createStaticEditor's ensureResetCSS()
             check so it does not inject the *global* (unscoped) reset.css. -->
        <link rel="stylesheet" href="../css/reset.css" disabled />
    </head>
    <body>
        <header class="host-header">
            <strong>Example Host Application</strong>
            <a href="../editor/">Full-page editor</a>
            <a href="https://fiduswriter.org/">fiduswriter.org</a>
        </header>
        <main class="host-main">
            <div class="host-note">
                This page embeds the Fidus Writer editor directly in a host
                page — no iframe. It uses fwtoolkit's scoped stylesheets
                (generated by <code>fwtoolkit</code>'s
                <code>build-scoped-css</code>) and the editor's own
                container-safe CSS. Changes are saved to localStorage.
            </div>
            <div id="fw-editor-app">
                <div id="fw-editor"></div>
            </div>
        </main>

        <script>
            // Editor dependencies call these globals while their modules are
            // being evaluated, before createStaticEditor runs.
            window.gettext = window.gettext || (msgid => msgid)
            window.interpolate =
                window.interpolate ||
                ((fmt, args) => {
                    if (Array.isArray(args)) {
                        let i = 0
                        return String(fmt).replace(/%s/g, () =>
                            args[i++] !== undefined
                                ? String(args[i - 1])
                                : ""
                        )
                    }
                    return String(fmt).replace(
                        /%\(([^)]+)\)s?/g,
                        (_match, key) =>
                            args && args[key] !== undefined
                                ? String(args[key])
                                : ""
                    )
                })
            window.staticUrl = window.staticUrl || (() => "")
        </script>
        <script type="module" src="./index.js"></script>
    </body>
</html>
